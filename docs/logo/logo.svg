  <path d="M124.5 96H131.5L130 162H126Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M124.5 96H131.5L130 162H126Z" fill="url(#beam)"/>

