      <stop offset="0.2" stop-color="#FFF0BE"/>
      <stop offset="0.45" stop-color="#FF9A2E" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kerf" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6A2B" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#FF7A2E" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="9.0" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- pannello da tagliare -->
  <rect x="44" y="150" width="168" height="66" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="150" width="168" height="66" rx="12" fill="url(#plate)"/>
  <rect x="44" y="150" width="168" height="5" rx="2.5" fill="#4A64B0" opacity="0.6"/>

  <!-- taglio: un cerchio quasi chiuso che parte dal punto di lavoro -->
  <path d="M128 162A23 23 0 1 0 151 185" fill="none" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="round"/>
  <path d="M128 162A23 23 0 1 0 151 185" fill="none" stroke="url(#kerf)" stroke-width="6" stroke-linecap="round"/>

