  <rect x="88" y="30" width="80" height="46" rx="11" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="88" y="30" width="80" height="46" rx="11" fill="url(#head)"/>
  <rect x="101" y="40" width="6" height="26" rx="3" fill="#22356B" opacity="0.3"/>
  <rect x="113" y="40" width="6" height="26" rx="3" fill="#22356B" opacity="0.3"/>
  <rect x="125" y="40" width="6" height="26" rx="3" fill="#22356B" opacity="0.3"/>
  <rect x="137" y="40" width="6" height="26" rx="3" fill="#22356B" opacity="0.3"/>
  <rect x="149" y="40" width="6" height="26" rx="3" fill="#22356B" opacity="0.3"/>
  <path d="M110 76H146L136 94a5 5 0 0 1-4.4 2.6h-7.2A5 5 0 0 1 120 94Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M110 76H146L136 94a5 5 0 0 1-4.4 2.6h-7.2A5 5 0 0 1 120 94Z" fill="url(#nozzle)"/>

  <!-- punto di lavoro e scintille -->
  <circle cx="128" cy="162" r="26" fill="url(#ember)"/>
  <g stroke="#FFFFFF" stroke-width="5.8" stroke-linecap="round">
    <path d="M143 152l15-10"/>
    <path d="M146 164l17 1"/>
    <path d="M112 151l-12-9"/>
