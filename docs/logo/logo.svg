<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18285A"/>
      <stop offset="0.55" stop-color="#0D1532"/>
      <stop offset="1" stop-color="#22104A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9BFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8A5CFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AFC0EC"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D5F5"/>
      <stop offset="1" stop-color="#8FA3DA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6BFF"/>
      <stop offset="0.55" stop-color="#4FD8FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="beamglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FA8FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5FA8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3E78"/>
      <stop offset="1" stop-color="#1A2650"/>
