# 0.20.8 (anteprima): versione per macOS costruita e provata sui Mac veri di GitHub (Apple Silicon e Intel).
# Per ora non entra nelle Release: produce il .dmg come «artifact» da scaricare e dare ai primi tester.
name: macOS (anteprima)

on:
  push:
    branches: ["mac-*"]
  workflow_dispatch:
    inputs:
      solo:
        description: "Solo queste prove (nomi dei file in tests/, separati da spazi; vuoto = tutte)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versione di Python del pacchetto
        id: py
        run: echo "rel=$(grep -oE 'PY_RELEASE = "[^"]+' build/prepara_installer.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Python per macOS dalla cache
        uses: actions/cache@v4
        with:
          path: build/cache
          key: python-mac-${{ matrix.arch }}-${{ steps.py.outputs.rel }}
      - name: FreeLaserCut.app e .dmg
        run: python build/prepara_mac.py --arch ${{ matrix.arch }}
      - name: Firma (ad hoc) e controlli del pacchetto
        run: |
          codesign -dv --verbose=2 build/mac/FreeLaserCut.app 2>&1 | head -20
          plutil -lint build/mac/FreeLaserCut.app/Contents/Info.plist
          file build/mac/FreeLaserCut.app/Contents/MacOS/FreeLaserCut-python
          spctl --assess --type execute -vv build/mac/FreeLaserCut.app || echo "(atteso: senza notarizzazione Gatekeeper lo rifiuta)"
      - name: Prova di avvio (finestra vera, Cocoa)
        run: |
          build/mac/FreeLaserCut.app/Contents/MacOS/FreeLaserCut --self-test | tee selftest.txt
          grep -q "prova di avvio" selftest.txt
          grep -q "piattaforma Qt cocoa" selftest.txt
          grep -q "pacchetto .app con la frase della camera: sì" selftest.txt
          grep -q "ESITO: tutto a posto" selftest.txt
      - name: Server per Claude (--mcp-server)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"prova","version":"1"}}}' \
            | build/mac/FreeLaserCut.app/Contents/MacOS/FreeLaserCut --mcp-server | tee mcp.txt
          grep -q '"serverInfo"' mcp.txt
      - name: SHA-256
        run: cd build && shasum -a 256 FreeLaserCut-*-macOS-*.dmg | tee SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLaserCut-macOS-${{ matrix.arch }}
          path: |
            build/FreeLaserCut-*-macOS-*.dmg
            build/SHA256SUMS-macos-*.txt
            selftest.txt

  # Le prove automatiche del programma su un Mac (come su Windows e Linux). Per ora solo per informazione.
  prove:
    runs-on: macos-15
    timeout-minutes: 170  # 0.20.8: il Mac di GitHub ha 3 processori; con le riprove da sole 75 minuti non bastavano
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      FLC_NO_FIRST_RUN: "1"
      FLC_PROVE_INSIEME: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Librerie Python
        run: python -m pip install -r requirements.txt
      - name: Indirizzi di prova in più sul Mac
        # 0.20.8: Linux e Windows rispondono su tutto 127.x.x.x, macOS solo su 127.0.0.1; la prova del Wi-Fi usa
        # 127.0.5.1 per un laser «in un'altra sottorete»
        run: sudo ifconfig lo0 alias 127.0.5.1 up
      - name: Prove (solo alcune)
        if: github.event_name == 'workflow_dispatch' && inputs.solo != ''
        env:
          SOLO: ${{ inputs.solo }}
        run: |
          rc=0
          for t in $SOLO; do
            echo "=== $t"; python tests/$t || rc=1
            echo "=== $t banco"; python tests/$t banco || rc=1
          done
          exit $rc
      - name: Prove
        if: github.event_name != 'workflow_dispatch' || inputs.solo == ''
        run: python tests/run_tests.py
