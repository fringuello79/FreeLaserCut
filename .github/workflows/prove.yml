# Prove automatiche: a ogni Push (e a ogni proposta di modifica) GitHub fa girare tutte le prove di
# tests/run_tests.py su Windows e su Linux, senza finestre (Qt "offscreen") e con il simulatore al posto del laser.
# Se qualcosa si rompe, la spunta del commit diventa rossa e GitHub manda un'email.
name: Prove automatiche

on:
  push:
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      FLC_NO_FIRST_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Librerie di sistema per Qt (solo Linux)
        if: runner.os == 'Linux'
        run: bash build/apt_install.sh libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Librerie Python
        run: python -m pip install -r requirements.txt
      - name: Prove
        run: python tests/run_tests.py
