# Prove automatiche: a ogni Push (e a ogni proposta di modifica) GitHub fa girare tutte le prove di
# tests/run_tests.py su Windows e su Linux, senza finestre (Qt "offscreen") e con il simulatore al posto del laser.
# Se qualcosa si rompe, la spunta del commit diventa rossa e GitHub manda un'email.
# 0.18.16: una volta sola per versione (il push del tag non le fa ripartire: è lo stesso codice del push su main)
# e quattro suite insieme invece di una alla volta.
name: Prove automatiche

on:
  push:
    branches: ["**"]  # solo i rami: un tag (v0.18.16) punta a un commit già provato
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90  # 0.21.2: il giro di Windows è arrivato a 51 minuti su 60 (vedi in fondo al registro le più lente)
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      FLC_NO_FIRST_RUN: "1"
      FLC_PROVE_INSIEME: "4"  # quattro suite insieme; una che fallisce così viene riprovata da sola (tests/run_tests.py)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Librerie di sistema per Qt (solo Linux)
        if: runner.os == 'Linux'
        run: bash build/apt_install.sh libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      # 0.20.7: senza schermo («offscreen») Qt su Windows non trova nessun carattere e usa misure finte, larghe il
      # doppio di quelle vere (12 px di media invece dei 6 di Segoe UI): le prove sulla larghezza delle scritte (barra in
      # basso, casella «Cerca un comando», pulsanti con il nome) erano rosse solo sul server. Con la cartella dei
      # caratteri di Windows le misure sono quelle di un PC vero (provato il 18/11: 99 px contro 101 per la stessa scritta).
      - name: Caratteri di Windows per le prove senza schermo
        if: runner.os == 'Windows'
        run: echo "QT_QPA_FONTDIR=C:\Windows\Fonts" >> $env:GITHUB_ENV
      - name: Librerie Python
        run: python -m pip install -r requirements.txt
      - name: Prove
        run: python tests/run_tests.py
